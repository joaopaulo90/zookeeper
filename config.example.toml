# Copy to config.local.toml (`just init`) and fill in. Never committed.

[devices]
# adb serials (`just devices`).
unit = ""    # the jiboia unit (debug build from jiboia's zookeeper branch)
phone = ""   # the phone that runs zoo-mobile's test build

[wifi]
# A network the unit joins during setup. It doesn't need to reach this
# computer: the unit talks to the local broker over USB (adb reverse).
ssid = ""
password = ""

